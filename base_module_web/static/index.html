<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARK Base Module Prototype</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #111827;
        color: #f9fafb;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        width: min(680px, 92vw);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 24px 28px 32px;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(16px);
      }
      h1 {
        margin-top: 0;
        font-size: 1.7rem;
        letter-spacing: 0.02em;
      }
      #conversation {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 20px 0 24px;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 6px;
      }
      .bubble {
        padding: 12px 14px;
        border-radius: 12px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .user {
        background: #2563eb;
        align-self: flex-end;
      }
      .assistant {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      .bubble__role {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.75rem;
        opacity: 0.7;
      }
      .bubble__content {
        white-space: pre-wrap;
      }
      .bubble__content--rich {
        white-space: normal;
        gap: 12px;
        display: flex;
        flex-direction: column;
      }
      form {
        display: flex;
        gap: 12px;
        flex-direction: column;
      }
      textarea {
        flex: 1;
        resize: vertical;
        min-height: 80px;
        max-height: 160px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(15, 23, 42, 0.6);
        color: inherit;
        padding: 10px 12px;
        font-size: 1rem;
      }
      .hint {
        font-size: 0.8rem;
        color: rgba(148, 163, 184, 0.8);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      button {
        background: #22c55e;
        color: #03111f;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
      }
      #status {
        font-size: 0.95rem;
        color: rgba(148, 163, 184, 0.8);
      }
      .calendar-card {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 18px 20px;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 14px;
        box-shadow: inset 0 1px 0 rgba(148, 163, 184, 0.12);
      }
      .calendar-card__heading {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .calendar-card__label {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .calendar-card__subtitle {
        font-size: 0.85rem;
        color: rgba(148, 163, 184, 0.85);
      }
      .calendar-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
      .calendar-day {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      .calendar-day--today {
        border-color: #22c55e;
        box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35);
      }
      .calendar-day__heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .calendar-day__label {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .calendar-day__meta {
        font-size: 0.75rem;
        color: rgba(148, 163, 184, 0.75);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .calendar-day__events {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .calendar-event {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 12px;
        align-items: start;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }
      .calendar-event__time {
        font-size: 0.85rem;
        font-weight: 600;
        color: rgba(94, 234, 212, 0.9);
      }
      .calendar-event__title {
        font-size: 0.95rem;
        font-weight: 500;
      }
      .calendar-event__note {
        grid-column: span 2;
        font-size: 0.8rem;
        color: rgba(148, 163, 184, 0.78);
      }
      .calendar-empty {
        font-size: 0.85rem;
        color: rgba(148, 163, 184, 0.75);
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px dashed rgba(148, 163, 184, 0.35);
        text-align: center;
      }
      @media (max-width: 720px) {
        .calendar-card {
          padding: 16px;
        }
        .calendar-grid {
          grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ARK Base Module Prototype</h1>
      <p id="status">Preparing conversation…</p>
      <section
        id="conversation"
        role="log"
        aria-live="polite"
        aria-label="Conversation"
      ></section>
      <form id="chat-form" aria-label="Send a message">
        <label class="sr-only" for="message">Message</label>
        <textarea
          id="message"
          required
          placeholder="Ask ARK anything…"
          aria-required="true"
          aria-describedby="keyboard-hint"
        ></textarea>
        <div id="keyboard-hint" class="hint">Enter to send • Shift+Enter for newline</div>
        <button type="submit" id="send" aria-label="Send message">Send</button>
      </form>
    </main>
    <script>
      const conversation = document.getElementById('conversation');
      const status = document.getElementById('status');
      const form = document.getElementById('chat-form');
      const messageInput = document.getElementById('message');
      const sendButton = document.getElementById('send');
      let sessionId = null;

      async function createSession() {
        status.textContent = 'Creating agent session…';
        try {
          const response = await fetch('/sessions', { method: 'POST' });
          if (!response.ok) throw new Error('Failed to start session');
          const payload = await response.json();
          sessionId = payload.session_id;
          renderMessages(payload.messages);
          if (payload.status === 'error') {
            status.textContent = 'Session started with warnings. Review conversation.';
          } else {
            status.textContent = 'Connected';
          }
        } catch (error) {
          console.error(error);
          status.textContent = 'Could not create session. Check server logs.';
          sendButton.disabled = true;
        }
      }

      function createCalendarMarkup(payload) {
        if (!payload || typeof payload !== 'object') {
          return null;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'calendar-card';

        const heading = document.createElement('div');
        heading.className = 'calendar-card__heading';

        const label = document.createElement('div');
        label.className = 'calendar-card__label';
        label.textContent = payload.week_label || 'Weekly Overview';
        heading.appendChild(label);

        if (payload.week_subtitle) {
          const subtitle = document.createElement('div');
          subtitle.className = 'calendar-card__subtitle';
          subtitle.textContent = payload.week_subtitle;
          heading.appendChild(subtitle);
        }

        wrapper.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'calendar-grid';

        const days = Array.isArray(payload.days) ? payload.days : [];
        if (!days.length) {
          const empty = document.createElement('div');
          empty.className = 'calendar-empty';
          empty.textContent = 'No events scheduled this week.';
          wrapper.appendChild(empty);
          return wrapper;
        }

        days.forEach((day) => {
          const column = document.createElement('section');
          column.className = 'calendar-day';
          if (day && day.is_today) {
            column.classList.add('calendar-day--today');
          }

          const header = document.createElement('header');
          header.className = 'calendar-day__heading';

          const dayLabel = document.createElement('div');
          dayLabel.className = 'calendar-day__label';
          dayLabel.textContent = day?.label || 'Day';
          header.appendChild(dayLabel);

          if (day?.meta) {
            const meta = document.createElement('div');
            meta.className = 'calendar-day__meta';
            meta.textContent = day.meta;
            header.appendChild(meta);
          }

          column.appendChild(header);

          const eventsList = document.createElement('ul');
          eventsList.className = 'calendar-day__events';

          const events = Array.isArray(day?.events) ? day.events : [];
          if (!events.length) {
            const emptyEvent = document.createElement('div');
            emptyEvent.className = 'calendar-empty';
            emptyEvent.textContent = 'No events';
            column.appendChild(emptyEvent);
          } else {
            events.forEach((event) => {
              if (!event || typeof event !== 'object') {
                return;
              }
              const item = document.createElement('li');
              item.className = 'calendar-event';

              const time = document.createElement('span');
              time.className = 'calendar-event__time';
              time.textContent = event.time || '';
              item.appendChild(time);

              const title = document.createElement('span');
              title.className = 'calendar-event__title';
              title.textContent = event.title || 'Scheduled event';
              item.appendChild(title);

              if (event.note) {
                const note = document.createElement('span');
                note.className = 'calendar-event__note';
                note.textContent = event.note;
                item.appendChild(note);
              }

              eventsList.appendChild(item);
            });
            column.appendChild(eventsList);
          }

          grid.appendChild(column);
        });

        wrapper.appendChild(grid);

        if (payload.call_to_action) {
          const cta = document.createElement('div');
          cta.className = 'calendar-card__subtitle';
          cta.textContent = payload.call_to_action;
          wrapper.appendChild(cta);
        }

        return wrapper;
      }

      function renderMessages(messages) {
        conversation.innerHTML = '';
        for (const msg of messages) {
          const bubble = document.createElement('article');
          bubble.classList.add('bubble', msg.role);
          bubble.setAttribute('role', 'text');
          bubble.setAttribute('aria-label', msg.role === 'user' ? 'You' : 'ARK');

          const label = document.createElement('span');
          label.className = 'bubble__role';
          label.textContent = msg.role === 'user' ? 'You' : 'ARK';

          const body = document.createElement('div');
          body.className = 'bubble__content';
          const isCalendar = msg.render_type === 'calendar_week' && msg.payload;
          if (isCalendar) {
            body.classList.add('bubble__content--rich');
            const calendarMarkup = createCalendarMarkup(msg.payload);
            if (calendarMarkup) {
              body.appendChild(calendarMarkup);
              const fallback = document.createElement('div');
              fallback.className = 'sr-only';
              fallback.textContent = msg.content ?? '';
              body.appendChild(fallback);
            } else {
              body.textContent = msg.content ?? '';
            }
          } else {
            body.textContent = msg.content ?? '';
          }

          bubble.appendChild(label);
          bubble.appendChild(body);
          conversation.appendChild(bubble);
        }
        conversation.scrollTop = conversation.scrollHeight;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!sessionId) return;
        const content = messageInput.value.trim();
        if (!content) return;

        sendButton.disabled = true;
        status.textContent = 'Waiting for response…';

        try {
          const response = await fetch(`/sessions/${sessionId}/message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: content })
          });
          if (!response.ok) throw new Error('Request failed');

          const payload = await response.json();
          renderMessages(payload.messages);
          messageInput.value = '';
          if (payload.status === 'error') {
            status.textContent = 'Response returned with errors. See conversation for details.';
          } else {
            status.textContent = 'Connected';
          }
        } catch (error) {
          console.error(error);
          status.textContent = 'Request failed. See console for details.';
        } finally {
          sendButton.disabled = false;
          messageInput.focus();
        }
      });

      messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      createSession();
    </script>
  </body>
</html>
