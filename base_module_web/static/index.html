<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARK Base Module Prototype</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #111827;
        color: #f9fafb;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        width: min(680px, 92vw);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 24px 28px 32px;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(16px);
      }
      h1 {
        margin-top: 0;
        font-size: 1.7rem;
        letter-spacing: 0.02em;
      }
      #conversation {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 20px 0 24px;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 6px;
      }
      .bubble {
        padding: 12px 14px;
        border-radius: 12px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .user {
        background: #2563eb;
        align-self: flex-end;
      }
      .assistant {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      .bubble__role {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.75rem;
        opacity: 0.7;
      }
      .bubble__content {
        white-space: pre-wrap;
      }
      form {
        display: flex;
        gap: 12px;
        flex-direction: column;
      }
      textarea {
        flex: 1;
        resize: vertical;
        min-height: 80px;
        max-height: 160px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(15, 23, 42, 0.6);
        color: inherit;
        padding: 10px 12px;
        font-size: 1rem;
      }
      .hint {
        font-size: 0.8rem;
        color: rgba(148, 163, 184, 0.8);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      button {
        background: #22c55e;
        color: #03111f;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
      }
      #status {
        font-size: 0.95rem;
        color: rgba(148, 163, 184, 0.8);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ARK Base Module Prototype</h1>
      <p id="status">Preparing conversation…</p>
      <section
        id="conversation"
        role="log"
        aria-live="polite"
        aria-label="Conversation"
      ></section>
      <form id="chat-form" aria-label="Send a message">
        <label class="sr-only" for="message">Message</label>
        <textarea
          id="message"
          required
          placeholder="Ask ARK anything…"
          aria-required="true"
          aria-describedby="keyboard-hint"
        ></textarea>
        <div id="keyboard-hint" class="hint">Enter to send • Shift+Enter for newline</div>
        <button type="submit" id="send" aria-label="Send message">Send</button>
      </form>
    </main>
    <script>
      const conversation = document.getElementById('conversation');
      const status = document.getElementById('status');
      const form = document.getElementById('chat-form');
      const messageInput = document.getElementById('message');
      const sendButton = document.getElementById('send');
      let sessionId = null;

      async function createSession() {
        status.textContent = 'Creating agent session…';
        try {
          const response = await fetch('/sessions', { method: 'POST' });
          if (!response.ok) throw new Error('Failed to start session');
          const payload = await response.json();
          sessionId = payload.session_id;
          renderMessages(payload.messages);
          if (payload.status === 'error') {
            status.textContent = 'Session started with warnings. Review conversation.';
          } else {
            status.textContent = 'Connected';
          }
        } catch (error) {
          console.error(error);
          status.textContent = 'Could not create session. Check server logs.';
          sendButton.disabled = true;
        }
      }

      function renderMessages(messages) {
        conversation.innerHTML = '';
        for (const msg of messages) {
          const bubble = document.createElement('article');
          bubble.classList.add('bubble', msg.role);
          bubble.setAttribute('role', 'text');
          bubble.setAttribute('aria-label', msg.role === 'user' ? 'You' : 'ARK');

          const label = document.createElement('span');
          label.className = 'bubble__role';
          label.textContent = msg.role === 'user' ? 'You' : 'ARK';

          const body = document.createElement('div');
          body.className = 'bubble__content';
          body.textContent = msg.content ?? '';

          bubble.appendChild(label);
          bubble.appendChild(body);
          conversation.appendChild(bubble);
        }
        conversation.scrollTop = conversation.scrollHeight;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!sessionId) return;
        const content = messageInput.value.trim();
        if (!content) return;

        sendButton.disabled = true;
        status.textContent = 'Waiting for response…';

        try {
          const response = await fetch(`/sessions/${sessionId}/message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: content })
          });
          if (!response.ok) throw new Error('Request failed');

          const payload = await response.json();
          renderMessages(payload.messages);
          messageInput.value = '';
          if (payload.status === 'error') {
            status.textContent = 'Response returned with errors. See conversation for details.';
          } else {
            status.textContent = 'Connected';
          }
        } catch (error) {
          console.error(error);
          status.textContent = 'Request failed. See console for details.';
        } finally {
          sendButton.disabled = false;
          messageInput.focus();
        }
      });

      messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      createSession();
    </script>
  </body>
</html>
